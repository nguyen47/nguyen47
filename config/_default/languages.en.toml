disabled = false
# Territory-qualified on purpose. Bare "en" is not a valid Open Graph locale
# (the format is language_TERRITORY), and this value also feeds hreflang, the
# RSS <language> tag and schema.org inLanguage. The <html lang> attribute is
# unaffected — params.isoCode below takes precedence there and stays "en".
locale = "en-US"
label = "English"
weight = 1
title = "Nguyen Hoang — AI Solutions Architect & Pre-Sales Consultant"

[params]
  displayName = "EN"
  isoCode = "en"
  rtl = false
  dateFormat = "2 January 2006"
  description = "AI Solutions Architect and APAC Pre-Sales Consultant. Enterprise AI, voice agents, computer vision, digital twin. Based in Da Nang, Vietnam."
  copyright = "© 2026 Nguyen Hoang"
  # logo = "img/logo.png"
  # secondaryLogo = "img/secondary-logo.png"

[params.author]
  name = "Nguyen Hoang"
  email = "hoangtrankhoinguyen@gmail.com"
  headline = "AI Solutions Architect & APAC Pre-Sales Consultant"
  # Currently a generated "NH" monogram placeholder. Replace
  # assets/img/avatar.jpg with a square headshot (1000x1000 or larger) —
  # no config change needed. Used on the homepage profile and article bylines.
  image = "img/avatar.jpg"
  imageQuality = 96
  links = [
    { linkedin = "https://www.linkedin.com/in/nguyen-hoang/" },
    { github = "https://github.com/nguyen47" },
    { stack-overflow = "https://stackoverflow.com/users/6786072/nguyen-hoang" },
    { email = "mailto:hoangtrankhoinguyen@gmail.com" },
  ]

# -- Person structured data --
# Consumed only by layouts/partials/extend-head-uncached.html, which emits a
# schema.org Person on the homepage. Name, email, headline, image and sameAs
# links are reused from [params.author] above rather than repeated here — this
# block holds the biographical facts that have nowhere else to live. Everything
# in it is asserted on /about and /resume; keep the three in sync.
[params.person]
  worksFor = "CMC Global"
  alumniOf = "Universiti Teknologi Malaysia"
  addressLocality = "Da Nang"
  addressCountry = "VN"
  knowsAbout = [
    "Enterprise AI Architecture",
    "Retrieval-Augmented Generation",
    "Voice AI Agents",
    "Computer Vision",
    "Edge Computing",
    "Digital Twin",
    "Solution Architecture",
    "Pre-Sales Engineering",
  ]
