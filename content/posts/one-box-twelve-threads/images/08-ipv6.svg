<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="f8-title f8-desc"><title id="f8-title">IPv6 that looks alive</title><desc id="f8-desc">cloudflared runs in an LXC that gets an IPv6 prefix from VNPT through router advertisements. The IPv6 path to the Cloudflare edge is broken and hangs at &#x27;connecting&#x27;. The IPv4 path connects. The fix is the flag --edge-ip-version 4. Lesson: if it hangs instead of failing, suspect IPv6.</desc><defs><filter id="f8-glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="f8-halo" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8"/></filter><filter id="f8-shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity=".5"/></filter><radialGradient id="f8-board" cx="50%" cy="38%" r="78%"><stop offset="0" stop-color="#155943"/><stop offset=".6" stop-color="#0d3b2f"/><stop offset="1" stop-color="#06201a"/></radialGradient><pattern id="f8-dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1.1" fill="#2b7d62"/></pattern><linearGradient id="f8-chip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#272c33"/><stop offset="1" stop-color="#111316"/></linearGradient><linearGradient id="f8-goldg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7de90"/><stop offset="1" stop-color="#c8982c"/></linearGradient><clipPath id="f8-clip"><rect width="1200" height="620" rx="26"/></clipPath></defs><style>.f8-p{fill:none;stroke-linecap:round}.f8-blink{animation:f8-blink 2.6s ease-in-out infinite}@keyframes f8-blink{0%,100%{opacity:1}50%{opacity:.3}}.f8-spin{transform-origin:600px 241.5px;animation:f8-rot 1.2s linear infinite}@keyframes f8-rot{to{transform:rotate(360deg)}}@keyframes f8-k1{from{stroke-dashoffset:26}to{stroke-dashoffset:-241}}@keyframes f8-k2{from{stroke-dashoffset:26}to{stroke-dashoffset:-566}}@keyframes f8-k3{from{stroke-dashoffset:26}to{stroke-dashoffset:-566}}@media (prefers-reduced-motion: reduce){.f8-p,.f8-blink,.f8-spin{animation:none!important}}</style><g clip-path="url(#f8-clip)"><rect y="0" width="1200" height="620" fill="url(#f8-board)"/><rect y="0" width="1200" height="620" fill="url(#f8-dots)" opacity=".45"/><rect x="12" y="12" width="1176" height="596" rx="18" fill="none" stroke="#eef2ea" stroke-opacity=".14" stroke-width="1.2" stroke-dasharray="1 7" stroke-linecap="round"/><circle cx="34" cy="586" r="13" fill="url(#f8-goldg)"/><circle cx="34" cy="586" r="7.5" fill="#03100c"/><circle cx="1166" cy="586" r="13" fill="url(#f8-goldg)"/><circle cx="1166" cy="586" r="7.5" fill="#03100c"/><circle cx="34" cy="34" r="13" fill="url(#f8-goldg)"/><circle cx="34" cy="34" r="7.5" fill="#03100c"/><circle cx="1166" cy="34" r="13" fill="url(#f8-goldg)"/><circle cx="1166" cy="34" r="7.5" fill="#03100c"/><g opacity="0.28"><circle cx="874.3" cy="445.3" r="3.6" fill="#e9c46a"/><circle cx="874.3" cy="445.3" r="1.6" fill="#04140f"/></g><g opacity="0.28"><circle cx="297.2" cy="286.1" r="3.6" fill="#e9c46a"/><circle cx="297.2" cy="286.1" r="1.6" fill="#04140f"/></g><g opacity="0.28"><circle cx="938.1" cy="95.2" r="3.6" fill="#e9c46a"/><circle cx="938.1" cy="95.2" r="1.6" fill="#04140f"/></g><g opacity="0.28"><circle cx="757" cy="441.9" r="3.6" fill="#e9c46a"/><circle cx="757" cy="441.9" r="1.6" fill="#04140f"/></g><g opacity="0.28"><circle cx="356.2" cy="399" r="3.6" fill="#e9c46a"/><circle cx="356.2" cy="399" r="1.6" fill="#04140f"/></g><g opacity="0.28"><circle cx="238.7" cy="356.4" r="3.6" fill="#e9c46a"/><circle cx="238.7" cy="356.4" r="1.6" fill="#04140f"/></g><g opacity="0.28"><circle cx="384.7" cy="237.2" r="3.6" fill="#e9c46a"/><circle cx="384.7" cy="237.2" r="1.6" fill="#04140f"/></g><g opacity="0.28"><circle cx="1003.3" cy="282" r="3.6" fill="#e9c46a"/>